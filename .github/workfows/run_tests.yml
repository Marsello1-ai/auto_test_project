name: Python autotests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Choose tests set'
        required: true
        type: choice
        default: 'smoke'
        options:
          - smoke
          - regression
          - extended
          - all

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run tests:
    runs-on: ubuntu-latest
    name: Run tests suite
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run tests
        run: |
          if [ "${{ github.event.inputs.deployment_target }}" == "all" ]; then
            pytest --alluredir=allure-results
          elif [ "${{ github.event.inputs.deployment_target }}" == "smoke" ]; then
            pytest -m smoke --alluredir=allure-results
          elif [ "${{ github.event.inputs.deployment_target }}" == "regression" ]; then
            pytest -m regression --alluredir=allure-results
          elif [ "${{ github.event.inputs.deployment_target }}" == "extended" ]; then
            pytest -m extended --alluredir=allure-results
          fi
        continue-on-error: true
      
      - name: Install Java
        uses: actions/setup-java@v3
        with:
          distribution: 'microsoft'
          java-version: '17'
      
      - name: Install Allure
        run: sudo wget https://github.com/allure-framework/allure2/releases/dowload/2.24.0.tgz && sudo tar -zxvf allure-2.24.0.tgz -C /opt/ && sudo ln -s /opt/allure-2.24.0/bin/allure /usr/bin/
      
      - name: Generate Allure report
        run: allure generate --clean allure-results -o _site
      
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: _site
          retention-days: 1

  publish-report:
    name: Report public
    runs-on: ubuntu-latest
    needs: run tests
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
